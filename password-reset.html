<body class="ds-backroom">
  <section class="ds-auth-screen">
    <form class="ds-auth-card" id="reset-form">
      <div class="ds-auth-kicker">PRIVATE ACCESS</div>
      <h1>Set owner password</h1>
      <p>Choose the password you want to use for the Back Room owner account.</p>
      <div class="ds-field"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="14" required /></div>
      <div class="ds-field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="14" required /></div>
      <p class="ds-auth-help">Use at least 14 characters with a mix of uppercase, lowercase, numbers, and symbols.</p>
      <button class="ds-btn" type="submit">Save password</button>
      <div id="reset-status" style="margin-top:14px" aria-live="polite"></div>
    </form>
  </section>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="password-reset.js?v=2"></script>
</body>
