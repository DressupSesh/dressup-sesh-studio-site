  <title>Reset Studio Password · Dressup Sesh</title>
  <link rel="stylesheet" href="styles.css?v=mobile-final-2">
  <link rel="stylesheet" href="auth.css?v=customer-recovery-1">
</head>
<body>
  <main class="password-reset-shell">
    <section class="auth-dialog password-reset-card" aria-labelledby="reset-title">
      <p class="eyebrow">STUDIO ACCESS</p>
      <h2 id="reset-title">Choose a new password</h2>
      <p>This changes the password for the Studio customer account that requested the reset.</p>
      <form id="studio-reset-form">
        <label>New password<input id="studio-new-password" type="password" autocomplete="new-password" minlength="14" required></label>
        <label>Confirm password<input id="studio-confirm-password" type="password" autocomplete="new-password" minlength="14" required></label>
        <button class="primary wide" id="studio-reset-submit" type="submit" disabled>SAVE NEW PASSWORD</button>
      </form>
      <p class="auth-message" id="studio-reset-message" aria-live="polite">Verifying your password reset link…</p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="studio-password-reset.js?v=1"></script>
</body>
